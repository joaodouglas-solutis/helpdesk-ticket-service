spring:
  application:
    name: ticket-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082